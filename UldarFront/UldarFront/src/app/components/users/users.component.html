<div class="user-list-container">
    <div class="user-card" *ngFor="let user of users">
        <a [routerLink]="['/users', user.email]">
        </a>
        <div class="user-info">
            <a [routerLink]="['/users', user.email]" class="username">{{ user.email }}</a>
            <p class="email">{{ user.email }}</p>
        </div>
    </div>
</div>
