services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_docker
    command: "daphne -b 0.0.0.0 -p 8000 settings.asgi:application"
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8000:8000"
    env_file: ".env"
    depends_on:
      - pgdb
      - redis

  pgdb:
    image: postgres:16
    container_name: pgdb
    env_file: ".env"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
    - pgdb_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker
    command: "celery -A settings.celery:app worker -l info"
    volumes:
      - .:/app
    working_dir: /app
    env_file: ".env"
    depends_on:
      - redis
      - pgdb

volumes:
  pgdb_data: